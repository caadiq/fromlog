<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .bk{font-size:18px}
.top b{font-size:12px;letter-spacing:2px;font-weight:800;color:#06b6d4}
.th{padding:26px 64px 0}
.th img{width:100%;display:block;box-shadow:0 20px 48px rgba(20,22,19,.2)}
.body{padding:22px 22px 60px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.4;text-wrap:balance}
.facts{margin-top:20px;border-top:2px solid #141613}
.fact{display:grid;grid-template-columns:96px 1fr;padding:13px 2px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:10px;letter-spacing:2px;color:#9B9E96;font-weight:800}
.fact .v{font-size:13.5px;font-weight:600}
.chip{font-size:11px;font-weight:700;background:#EDF5EF;color:#3E6348;padding:4px 11px;border-radius:99px;margin-right:5px}
.replay{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:14px 0;background:#141613;color:#fff;font-size:12px;letter-spacing:1.5px;font-weight:800}
</style></head><body>
<div class="top"><span class="bk">←</span><b>예능</b></div>
<div class="th"><img src="https://s3.caadiq.co.kr/fromis-9/schedule/2509/thumbnail/medium_800/thumbnail.webp"></div>
<div class="body">
  <h1>고나리돌: NEW STEP 16화</h1>
  <div class="facts">
    <div class="fact"><span class="k">DATE</span><span class="v">2026. 3. 3. (화) 20:00</span></div>
    <div class="fact"><span class="k">BROADCAST</span><span class="v">TVING</span></div>
    <div class="fact"><span class="k">MEMBERS</span><span class="v"><span class="chip">프로미스나인</span></span></div>
  </div>
  <div class="replay">▶ TVING에서 다시보기</div>
</div>
</body></html>
