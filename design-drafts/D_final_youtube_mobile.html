<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .bk{font-size:18px}
.top b{font-size:12px;letter-spacing:2px;font-weight:800;color:#ff0033}
.mv{position:relative;background:#141613;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #E8E8E3}
.mv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.mv .play{position:relative;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:19px;color:#141613}
.body{padding:22px 22px 60px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.4;text-wrap:balance}
.meta{display:flex;align-items:center;gap:10px;margin-top:16px;padding-bottom:18px;border-bottom:1px solid #E8E8E3}
.meta .av{width:38px;height:38px;border-radius:50%;background:#141613;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.meta .n b{display:block;font-size:15px;font-weight:800}
.meta .n span{font-size:11px;color:#9B9E96}
.meta .go{margin-left:auto;font-size:10.5px;letter-spacing:1.5px;font-weight:800;border:1px solid #141613;padding:9px 14px}
.facts{margin-top:4px}
.fact{display:grid;grid-template-columns:88px 1fr;padding:13px 2px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:10px;letter-spacing:2px;color:#9B9E96;font-weight:800}
.fact .v{font-size:13.5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;background:#EDF5EF;color:#3E6348;padding:4px 11px;border-radius:99px}
</style></head><body>
<div class="top"><span class="bk">←</span><b>유튜브</b></div>
<div class="mv"><img src="https://img.youtube.com/vi/yKke2mAxBxQ/maxresdefault.jpg"><div class="play">▶</div></div>
<div class="body">
  <h1>🔔 오아 완판 도전! 서로의 아바타가 된 프로미스나인 송하영·이나경💦 | 방판소녀들 EP.04</h1>
  <div class="meta">
    <div class="n"><b>방판소녀들</b></div>
    <span class="go">채널 →</span>
  </div>
  <div class="facts">
    <div class="fact"><span class="k">DATE</span><span class="v">2026. 7. 6. (월) 19:00</span></div>
    <div class="fact"><span class="k">MEMBERS</span><span class="v"><span class="chips"><span class="chip">송하영</span><span class="chip">이나경</span></span></span></div>
  </div>
</div>
</body></html>
