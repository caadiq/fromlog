<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1600px;background:#FBFBF9;color:#141613}
.hd{display:flex;align-items:center;padding:0 40px;height:60px;border-bottom:1px solid #E8E8E3}
.hd .logo{font-size:19px;font-weight:900;letter-spacing:-.5px}
.hd .tag{font-size:9px;font-weight:800;letter-spacing:2px;background:#141613;color:#fff;padding:4px 8px;margin-left:10px}
.hd nav{display:flex;gap:24px;margin-left:40px}
.hd nav span{font-size:11px;font-weight:800;letter-spacing:2px;color:#9B9E96}
.hd nav span.on{color:#141613}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.hd .who{font-size:12px;color:#71756D}
.hd .out{font-size:10px;font-weight:800;letter-spacing:1.5px;border:1px solid #141613;padding:8px 14px}
.wrap{max-width:1100px;margin:0 auto;padding:52px 40px 90px}
.crumb{font-size:10.5px;letter-spacing:2.5px;font-weight:800;color:#9B9E96}
.title{margin-top:12px;font-size:44px;font-weight:900;letter-spacing:-2px}
.title i{font-style:normal;color:transparent;-webkit-text-stroke:1.6px #141613}
.sec{display:flex;align-items:baseline;gap:10px;font-size:11px;letter-spacing:3px;font-weight:800;border-top:2px solid #141613;padding-top:14px;margin-top:40px}
.sec .cnt{font-size:11px;color:#548360;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:18px}
.mb{background:#fff;border:1px solid #E8E8E3}
.mb .ph{aspect-ratio:3/4;background:#EFEFEA;overflow:hidden}
.mb .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mb.gray .ph img{filter:grayscale(1);opacity:.75}
.mb .inf{padding:12px 14px 13px;display:flex;align-items:baseline;justify-content:space-between}
.mb b{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.mb span{font-size:9px;letter-spacing:1.5px;font-weight:800;color:#9B9E96}
</style></head><body>
<div class="hd">

    <div class="mb"><div class="ph"><img src="https://s3.caadiq.co.kr/fromis-9/member/박지원/thumb_400/박지원.webp"></div><div class="inf"><b>박지원</b><span>EDIT →</span></div></div>

</body></html>
