<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .mon{display:flex;align-items:center;gap:12px}
.top .mon b{font-size:19px;font-weight:900;color:#548360}
.top .mon .cev{font-size:12px;color:#548360;transform:rotate(180deg)}
.top .ic{display:flex;gap:16px;font-size:16px}
.top .ic .on{color:#548360}
.pick{border-bottom:1px solid #E8E8E3;padding:22px 22px 26px;background:#fff}
.yr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.yr b{font-size:14px;font-weight:900;letter-spacing:1px}
.yr span{color:#9B9E96;font-size:14px}
.lab{font-size:10px;letter-spacing:2.5px;font-weight:800;color:#9B9E96;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{text-align:center;padding:13px 0;font-size:14px;font-weight:700;color:#3D423E;border:1px solid #E8E8E3}
.cell.sel{background:#141613;color:#fff;border-color:#141613}
.cell.now{color:#548360;border-color:#548360}
.cell.dis{color:#D8DAD2}
</style></head><body>
<div class="top">
  <div class="mon"><b>2026. 7</b><span class="cev">▼</span></div>
  <div class="ic"><span class="on">▦</span><span>⌕</span></div>
</div>
<div class="pick">
  <div class="yr"><span>‹</span><b>2024 — 2027</b><span>›</span></div>
  <div class="lab">YEAR</div>
  <div class="grid">
    <div class="cell dis">2024</div><div class="cell">2025</div><div class="cell sel">2026</div><div class="cell">2027</div>
  </div>
  <div class="lab">MONTH</div>
  <div class="grid">
    <div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div>
    <div class="cell">5</div><div class="cell">6</div><div class="cell sel now">7</div><div class="cell">8</div>
    <div class="cell">9</div><div class="cell">10</div><div class="cell">11</div><div class="cell">12</div>
  </div>
</div>
</body></html>
