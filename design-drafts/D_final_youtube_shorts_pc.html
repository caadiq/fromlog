<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1440px;background:#FBFBF9;color:#141613}
.nav{display:flex;align-items:center;padding:22px 70px;border-bottom:1px solid #E8E8E3}
.logo{font-weight:800;font-size:19px}
.nav .links{display:flex;gap:34px;margin-left:60px}
.nav a{font-size:12px;font-weight:700;letter-spacing:2px;color:#9B9E96;text-decoration:none}
.nav a.on{color:#141613}
.nav .r{margin-left:auto;font-size:11px;letter-spacing:2.5px;color:#9B9E96;font-weight:600}
.grid{display:flex;justify-content:center;min-height:760px}
.mv{border-right:1px solid #E8E8E3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0 56px}
.mv{padding:40px 0}
.mv .frame{position:relative;height:640px;aspect-ratio:9/16;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mv .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.mv .play{position:relative;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:30px;color:#141613;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.info{padding:56px 64px 50px;display:flex;flex-direction:column;width:560px}
.crumb{font-size:11px;letter-spacing:2.5px;font-weight:800}
.crumb .cat{color:#ff0033}
.crumb i{font-style:normal;color:#C6C8C0;margin:0 8px}
.crumb .dt{color:#9B9E96}
h1{font-size:30px;font-weight:800;letter-spacing:-.7px;line-height:1.45;margin-top:26px;text-wrap:balance}
.meta{display:flex;align-items:center;gap:13px;margin-top:30px;padding:18px 0;border-top:2px solid #141613;border-bottom:1px solid #E8E8E3}
.meta .av{width:44px;height:44px;border-radius:50%;background:#141613;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.meta .n b{display:block;font-size:15px;font-weight:800}
.meta .n span{font-size:11.5px;color:#9B9E96}
.meta .go{margin-left:auto;font-size:11px;letter-spacing:1.5px;font-weight:800;border:1px solid #141613;padding:11px 18px}
.fact{display:grid;grid-template-columns:120px 1fr;padding:15px 2px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:11px;letter-spacing:2.5px;color:#9B9E96;font-weight:800}
.fact .v{font-size:14.5px;font-weight:600}
.chip{font-size:12px;font-weight:700;background:#EDF5EF;color:#3E6348;padding:5px 13px;border-radius:99px;margin-right:5px}
.wm{margin-top:auto;font-size:11px;letter-spacing:2.5px;color:#D8DAD2;font-weight:800}
</style></head><body>
<div class="nav"><div class="logo">fromis_9</div><div class="links"><a href="#">HOME</a><a href="#">MEMBERS</a><a href="#">DISCOGRAPHY</a><a class="on" href="#">SCHEDULE</a></div><div class="r">FAN ARCHIVE — SINCE 2018</div></div>
<div class="grid">
  <div class="mv"><div class="frame"><img src="https://s3.caadiq.co.kr/fromis-9/album/glow-me/photo/thumb_400/06.webp"><div class="play">▶</div></div></div>
  <div class="info">
    <div class="crumb"><span class="cat">유튜브 · SHORTS</span><i>/</i><span class="dt">2026. 7. 6. (월)</span></div>
    <h1>지원언니가 사준 인생네컷 (촬영비하인드) #fromis_9 #프로미스나인</h1>
    <div class="meta">
      <div class="n"><b>fromis_9</b></div>
      <span class="go">채널 보기 →</span>
    </div>
    <div class="fact"><span class="k">MEMBERS</span><span class="v"><span class="chip">박지원</span><span class="chip">백지헌</span></span></div>
    <div class="wm">SCHEDULE — SHORTS</div>
  </div>
</div>
</body></html>
