<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .bk{font-size:18px}
.top b{font-size:12px;letter-spacing:2px;font-weight:800;color:#f97316}
.poster{padding:26px 56px 0}
.poster img{width:100%;display:block;box-shadow:0 20px 48px rgba(20,22,19,.22)}
.body{padding:26px 22px 60px}
h1{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.35;text-wrap:balance}
.rounds{display:flex;gap:6px;margin-top:16px}
.rd{flex:1;text-align:center;border:1px solid #E8E8E3;padding:10px 0}
.rd b{display:block;font-size:13px;font-weight:800}
.rd span{font-size:10px;color:#9B9E96;font-weight:700;letter-spacing:1px}
.rd.on{background:#141613;border-color:#141613}
.rd.on b,.rd.on span{color:#fff}
.facts{margin-top:20px;border-top:2px solid #141613}
.fact{display:grid;grid-template-columns:88px 1fr;padding:13px 2px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:10px;letter-spacing:2px;color:#9B9E96;font-weight:800}
.fact .v{font-size:13.5px;font-weight:600}
.fact .v .sub{display:block;font-size:11.5px;color:#9B9E96;font-weight:500;margin-top:2px}
.sec{font-size:11px;letter-spacing:3px;font-weight:800;border-top:2px solid #141613;padding-top:14px;margin:28px 0 4px}
.sl .tr{display:flex;align-items:baseline;gap:13px;padding:12px 2px;border-bottom:1px solid #E8E8E3}
.sl .no{font-size:11.5px;font-weight:800;color:#C6C8C0;width:22px;font-variant-numeric:tabular-nums}
.sl .t{flex:1;font-size:14px;font-weight:700;letter-spacing:-.2px}
.sl .more{padding:14px 0;text-align:center;font-size:10.5px;letter-spacing:2px;font-weight:800;color:#548360}
.md{display:flex;gap:10px;margin-top:14px}
.md .m{flex:1}
.md img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border:1px solid #E8E8E3}
.md b{display:block;font-size:12px;font-weight:700;margin-top:7px}
</style></head><body>
<div class="top"><span class="bk">←</span><b>콘서트</b></div>
<div class="poster"><img src="https://s3.caadiq.co.kr/fromis-9/concert/3/poster/medium_800/poster.webp"></div>
<div class="body">
  <h1>fromis_9 WORLD TOUR NOW TOMORROW. IN SEOUL</h1>
  <div class="rounds">
    <div class="rd"><b>8. 8. (금)</b><span>19:30</span></div>
    <div class="rd on"><b>8. 9. (토)</b><span>18:00</span></div>
    <div class="rd"><b>8. 10. (일)</b><span>16:00</span></div>
  </div>
  <div class="facts">
    <div class="fact"><span class="k">DATE</span><span class="v">2025. 8. 9. (토) 18:00</span></div>
    <div class="fact"><span class="k">VENUE</span><span class="v">장충체육관<span class="sub">서울 중구 동호로 241</span></span></div>
  </div>
  <div class="sec">SETLIST — 23</div>
  <div class="sl">
    <div class="tr"><span class="no">01</span><span class="t">WE GO</span></div>
    <div class="tr"><span class="no">02</span><span class="t">Stay This Way</span></div>
    <div class="tr"><span class="no">03</span><span class="t">REBELUTIONAL</span></div>
    <div class="tr"><span class="no">04</span><span class="t">Love=Disaster</span></div>
    <div class="tr"><span class="no">05</span><span class="t">Feel Good</span></div>
    <div class="more">전체 23곡 펼치기 ↓</div>
  </div>
  <div class="sec">MD</div>
  <div class="md">
    <div class="m"><img src="https://s3.caadiq.co.kr/fromis-9/concert/3/md/medium_800/01.webp"><b>공식 응원봉</b></div>
    <div class="m"><img src="https://s3.caadiq.co.kr/fromis-9/concert/3/md/medium_800/02.webp"><b>포토북 세트</b></div>
  </div>
</div>
</body></html>
