<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1600px;background:#FBFBF9;color:#141613}
.hd{display:flex;align-items:center;padding:0 40px;height:60px;border-bottom:1px solid #E8E8E3}
.hd .logo{font-size:19px;font-weight:900;letter-spacing:-.5px}
.hd .tag{font-size:9px;font-weight:800;letter-spacing:2px;background:#141613;color:#fff;padding:4px 8px;margin-left:10px}
.hd nav{display:flex;gap:24px;margin-left:40px}
.hd nav span{font-size:11px;font-weight:800;letter-spacing:2px;color:#9B9E96}
.hd nav span.on{color:#141613}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.hd .who{font-size:12px;color:#71756D}
.hd .out{font-size:10px;font-weight:800;letter-spacing:1.5px;border:1px solid #141613;padding:8px 14px}
.wrap{max-width:880px;margin:0 auto;padding:52px 40px 90px}
.crumb{font-size:10.5px;letter-spacing:2.5px;font-weight:800;color:#9B9E96}
.title{margin-top:12px;font-size:44px;font-weight:900;letter-spacing:-2px}
.title i{font-style:normal;color:transparent;-webkit-text-stroke:1.6px #141613}
.grid{display:grid;grid-template-columns:250px 1fr;gap:40px;margin-top:36px;border-top:2px solid #141613;padding-top:32px}
.photo{aspect-ratio:3/4;border:1px solid #E8E8E3;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .chg{position:absolute;bottom:0;left:0;right:0;background:rgba(20,22,19,.82);color:#fff;text-align:center;font-size:10.5px;letter-spacing:2px;font-weight:800;padding:11px 0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:28px 30px;height:fit-content}
.fd.full{grid-column:span 2}
.lab{font-size:10px;font-weight:800;letter-spacing:2px;color:#9B9E96}
.inp{border-bottom:2px solid #141613;padding:10px 2px 9px;margin-top:7px;font-size:15px;font-weight:700}
.inp.ph{color:#C6C8C0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:11.5px;font-weight:700;background:#EDF5EF;color:#3E6348;padding:6px 12px}
.chips span i{font-style:normal;margin-left:6px;color:#8FAF98}
.chips .add{background:#fff;border:1px dashed #C6C8C0;color:#9B9E96}
.selrow{display:flex;gap:7px;margin-top:8px}
.selrow span{font-size:11.5px;font-weight:800;padding:10px 18px;border:1px solid #E8E8E3;color:#71756D;background:#fff}
.selrow span.on{background:#141613;color:#fff;border-color:#141613}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:44px;padding-top:24px;border-top:1px solid #E8E8E3}
.btn{font-size:11.5px;font-weight:800;letter-spacing:1.5px;padding:13px 26px;border:1px solid #E8E8E3;color:#71756D;background:#fff}
.btn.ink{background:#141613;border-color:#141613;color:#fff}
</style></head><body>
<div class="hd">
  <span class="logo">fromis_9</span><span class="tag">ADMIN</span>
  <nav><span>DASHBOARD</span><span class="on">MEMBERS</span><span>ALBUMS</span><span>SCHEDULE</span><span>LOGS</span></nav>
  <div class="right"><span class="who">caadiq 님</span><span class="out">로그아웃</span></div>
</div>
<div class="wrap">
  <div class="crumb">ADMIN / MEMBERS / EDIT</div>
  <div class="title">EDIT <i>MEMBER</i></div>

  <div class="grid">
    <div class="photo"><img src="https://s3.caadiq.co.kr/fromis-9/member/박지원/thumb_400/박지원.webp"><span class="chg">사진 변경</span></div>
    <div class="fields">
      <div class="fd"><div class="lab">이름</div><div class="inp">박지원</div></div>
      <div class="fd"><div class="lab">영문 이름</div><div class="inp">PARK JIWON</div></div>
      <div class="fd"><div class="lab">생년월일</div><div class="inp">1998. 3. 20.</div></div>
      <div class="fd"><div class="lab">인스타그램</div><div class="inp" style="font-size:13.5px">instagram.com/jiwonparkk...</div></div>
      <div class="fd full"><div class="lab">별명</div>
        <div class="chips"><span>지원 <i>✕</i></span><span>박먼지 <i>✕</i></span><span>메보 <i>✕</i></span><span class="add">+ 별명 추가</span></div>
      </div>
      <div class="fd full"><div class="lab">활동 상태</div><div class="selrow"><span class="on">활동 중</span><span>탈퇴</span></div></div>
    </div>
  </div>

  <div class="foot"><span class="btn">취소</span><span class="btn ink">저장</span></div>
</div>
</body></html>
