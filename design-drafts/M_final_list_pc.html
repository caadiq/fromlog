*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1440px;background:#FBFBF9;color:#141613}
.nav{display:flex;align-items:center;padding:22px 70px;border-bottom:1px solid #E8E8E3}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}
.nav .links{display:flex;gap:34px;margin-left:60px}
.nav a{font-size:12px;font-weight:700;letter-spacing:2px;color:#9B9E96;text-decoration:none}
.nav a.on{color:#141613}
.nav .r{margin-left:auto;font-size:11px;letter-spacing:2.5px;color:#9B9E96;font-weight:600}
.head{padding:64px 70px 40px;border-bottom:1px solid #E8E8E3;display:flex;align-items:flex-end;justify-content:space-between}
.head .kicker{font-size:12px;letter-spacing:4px;color:#548360;font-weight:700}
.head h1{font-size:88px;font-weight:900;letter-spacing:-4px;line-height:1}
.head h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px #548360}
.head .r{font-size:12.5px;color:#9B9E96;letter-spacing:2px;font-weight:600;text-align:right;line-height:2}
.mems{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #E8E8E3}
.mem{border-right:1px solid #E8E8E3;border-bottom:1px solid #E8E8E3;position:relative;cursor:pointer}
.mem:nth-child(3n){border-right:0}
.mem:nth-child(n+4){border-bottom:0}
.empty{border-bottom:0;display:flex;align-items:center;justify-content:center}
.empty span{font-size:13px;letter-spacing:4px;color:#D8DAD2;font-weight:800}
.mem .ph{position:relative;overflow:hidden}
.mem img{width:100%;aspect-ratio:.82;object-fit:cover;display:block;filter:saturate(1.02)}
.mem .no{position:absolute;top:18px;left:20px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);letter-spacing:1px}
.mem .cap{padding:20px 22px 26px}
.mem .cap b{display:block;font-size:22px;font-weight:900;letter-spacing:-.6px}
.mem .cap .en{font-size:10.5px;letter-spacing:2.5px;color:#9B9E96;font-weight:700;margin-top:3px;display:block}
.mem .cap .bd{font-size:11.5px;color:#71756D;margin-top:10px;display:flex;align-items:center;gap:7px}
.mem .cap .bd i{font-style:normal;font-size:10px;font-weight:800;color:#548360;letter-spacing:1px}
.former{padding:44px 70px 90px}
.former .sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.former .sec b{font-size:13px;letter-spacing:3.5px;font-weight:800;color:#9B9E96}
.frow{display:flex;gap:0;border-top:1px solid #E8E8E3}
.f{flex:1;display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid #E8E8E3;border-right:1px solid #E8E8E3}
.f:last-child{border-right:0}
.f img{width:52px;height:52px;border-radius:50%;object-fit:cover;filter:grayscale(.4) saturate(.85)}
.f b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px;color:#71756D}
.f span{font-size:10px;letter-spacing:2px;color:#B9BCB3;font-weight:700}
</style></head><body>
