<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .bk{font-size:18px}
.sbox{flex:1;display:flex;align-items:center;gap:10px;border-bottom:2px solid #141613;padding-bottom:6px}
.sbox .ic{font-size:15px;color:#9B9E96}
.sbox input{flex:1;border:0;outline:0;background:transparent;font-size:17px;font-weight:800;letter-spacing:-.3px;font-family:inherit;min-width:0}
.sbox .x{font-size:13px;color:#9B9E96}
.sugs{display:flex;align-items:center;gap:6px;padding:14px 20px;border-bottom:1px solid #E8E8E3;overflow:hidden}
.sugs .k{font-size:9px;letter-spacing:1.5px;color:#9B9E96;font-weight:800;margin-right:4px;white-space:nowrap}
.sug{font-size:11px;font-weight:700;border:1px solid #E8E8E3;padding:6px 12px;color:#71756D;white-space:nowrap}
.cnt{display:flex;align-items:baseline;gap:10px;padding:22px 22px 10px}
.cnt b{font-size:11px;letter-spacing:2.5px;font-weight:800}
.cnt span{font-size:11px;color:#548360;font-weight:700}
.res{margin:0 22px;border-top:2px solid #141613;padding-bottom:60px}
.rrow{display:flex;align-items:baseline;gap:13px;padding:15px 2px;border-bottom:1px solid #E8E8E3}
.rrow .d{width:60px;flex-shrink:0}
.rrow .d b{display:block;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.rrow .d span{font-size:9px;letter-spacing:1px;color:#9B9E96;font-weight:700}
.rrow .t{flex:1;min-width:0}
.rrow .t b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .t b mark{background:transparent;color:#548360}
.rrow .t span{font-size:10.5px;color:#9B9E96;margin-top:2px;display:block}
.rrow .c{font-size:9.5px;font-weight:800;white-space:nowrap}
</style></head><body>
<div class="top"><span class="bk">←</span>
  <div class="sbox"><span class="ic">⌕</span><input value="방판소녀들"><span class="x">✕</span></div>
</div>
<div class="sugs"><span class="k">RECENT</span><span class="sug">워크돌</span><span class="sug">글로우미</span><span class="sug">컴백</span></div>
<div class="cnt"><b>RESULTS</b><span>12건</span></div>
<div class="res">
  <div class="rrow"><div class="d"><b>7. 13.</b><span>MON 19:00</span></div><div class="t"><b><mark>방판소녀들</mark> 5화</b><span>방판소녀들</span></div><span class="c" style="color:#ff0033">유튜브</span></div>
  <div class="rrow"><div class="d"><b>7. 6.</b><span>MON 19:00</span></div><div class="t"><b>🔔 오아 완판 도전! 서로의 아바타가 된 프로미스나인 | <mark>방판소녀들</mark> EP.04</b><span>방판소녀들</span></div><span class="c" style="color:#ff0033">유튜브</span></div>
  <div class="rrow"><div class="d"><b>6. 29.</b><span>MON 19:00</span></div><div class="t"><b>지방러들 오이데~🍊 | <mark>방판소녀들</mark> EP.03</b><span>방판소녀들</span></div><span class="c" style="color:#ff0033">유튜브</span></div>
  <div class="rrow"><div class="d"><b>6. 22.</b><span>MON 19:00</span></div><div class="t"><b><mark>방판소녀들</mark> EP.02</b><span>방판소녀들</span></div><span class="c" style="color:#ff0033">유튜브</span></div>
</div>
</body></html>
