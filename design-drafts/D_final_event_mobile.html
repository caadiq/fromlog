<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .bk{font-size:18px}
.top b{font-size:12px;letter-spacing:2px;font-weight:800;color:#D9A400}
.poster{padding:26px 44px 0}
.poster img{width:100%;display:block;box-shadow:0 20px 48px rgba(20,22,19,.2)}
.body{padding:26px 22px 60px}
h1{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.35;text-wrap:balance}
.facts{margin-top:22px;border-top:2px solid #141613}
.fact{display:grid;grid-template-columns:88px 1fr;padding:13px 2px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:10px;letter-spacing:2px;color:#9B9E96;font-weight:800}
.fact .v{font-size:13.5px;font-weight:600;line-height:1.55}
.fact .v .sub{display:block;font-size:11.5px;color:#9B9E96;font-weight:500;margin-top:2px}
.chip{font-size:11px;font-weight:700;background:#EDF5EF;color:#3E6348;padding:4px 11px;border-radius:99px;margin-right:5px}
.mapbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:14px 0;border:1px solid #141613;font-size:12px;letter-spacing:1.5px;font-weight:800}
</style></head><body>
<div class="top"><span class="bk">←</span><b>행사</b></div>
<div class="poster"><img src="https://s3.caadiq.co.kr/fromis-9/event/2673/poster/medium_800/1780285762206_0.jpeg"></div>
<div class="body">
  <h1>경희대학교 서울캠퍼스 MASTERPEACE:SOULMATE</h1>
  <div class="facts">
    <div class="fact"><span class="k">DATE</span><span class="v">2026. 5. 28. (목) 18:00</span></div>
    <div class="fact"><span class="k">VENUE</span><span class="v">경희대학교 서울캠퍼스<span class="sub">서울 동대문구 경희대로 26</span></span></div>
    <div class="fact"><span class="k">MEMBERS</span><span class="v"><span class="chip">프로미스나인</span></span></div>
  </div>
  <div class="mapbtn">◎ 카카오맵에서 위치 보기</div>
</div>
</body></html>
