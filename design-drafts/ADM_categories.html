<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1600px;background:#FBFBF9;color:#141613}
.hd{display:flex;align-items:center;padding:0 40px;height:60px;border-bottom:1px solid #E8E8E3}
.hd .logo{font-size:19px;font-weight:900;letter-spacing:-.5px}
.hd .tag{font-size:9px;font-weight:800;letter-spacing:2px;background:#141613;color:#fff;padding:4px 8px;margin-left:10px}
.hd nav{display:flex;gap:24px;margin-left:40px}
.hd nav span{font-size:11px;font-weight:800;letter-spacing:2px;color:#9B9E96}
.hd nav span.on{color:#141613}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.hd .who{font-size:12px;color:#71756D}
.hd .out{font-size:10px;font-weight:800;letter-spacing:1.5px;border:1px solid #141613;padding:8px 14px}
.wrap{max-width:820px;margin:0 auto;padding:52px 40px 90px}
.top{display:flex;align-items:flex-end;justify-content:space-between}
.crumb{font-size:10.5px;letter-spacing:2.5px;font-weight:800;color:#9B9E96}
.title{margin-top:12px;font-size:44px;font-weight:900;letter-spacing:-2px}
.title i{font-style:normal;color:transparent;-webkit-text-stroke:1.6px #141613}
.btn{font-size:11.5px;font-weight:800;letter-spacing:1.5px;padding:12px 22px;background:#141613;color:#fff;margin-bottom:8px}
.list{margin-top:32px;border-top:2px solid #141613}
.row{display:flex;align-items:center;gap:16px;padding:17px 4px;border-bottom:1px solid #E8E8E3}
.row .grip{color:#C6C8C0;font-size:14px;letter-spacing:-2px}
.row i{width:11px;height:11px;border-radius:50%;display:inline-block}
.row b{font-size:15px;font-weight:800}
.row .cnt{font-size:11.5px;color:#9B9E96}
.row .lock{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#C6C8C0;border:1px solid #E8E8E3;padding:4px 8px}
.row .ops{margin-left:auto;display:flex;gap:14px}
.row .ops span{font-size:11.5px;font-weight:700;color:#71756D}
.row .ops span.del{color:#C97070}
.row .ops span.dis{color:#D8DAD2}
.hint{margin-top:16px;font-size:11.5px;color:#9B9E96}
</style></head><body>
<div class="hd">
  <span class="logo">fromis_9</span><span class="tag">ADMIN</span>
  <nav><span>DASHBOARD</span><span>MEMBERS</span><span>ALBUMS</span><span class="on">SCHEDULE</span><span>LOGS</span></nav>
  <div class="right"><span class="who">caadiq 님</span><span class="out">로그아웃</span></div>
</div>
<div class="wrap">
  <div class="top">
    <div><div class="crumb">ADMIN / SCHEDULE / CATEGORIES</div><div class="title">CATE<i>GORIES</i></div></div>
    <span class="btn">+ 카테고리 추가</span>
  </div>

  <div class="list">
    <div class="row"><span class="grip">⣿</span><i style="background:#ff0033"></i><b>유튜브</b><span class="cnt">527</span><span class="lock">기본</span><div class="ops"><span>수정</span><span class="del dis">삭제</span></div></div>
    <div class="row"><span class="grip">⣿</span><i style="background:#0f1419"></i><b>X</b><span class="cnt">1,161</span><span class="lock">기본</span><div class="ops"><span>수정</span><span class="del dis">삭제</span></div></div>
    <div class="row"><span class="grip">⣿</span><i style="background:#6366f1"></i><b>앨범</b><span class="cnt">17</span><span class="lock">기본</span><div class="ops"><span>수정</span><span class="del dis">삭제</span></div></div>
    <div class="row"><span class="grip">⣿</span><i style="background:#f97316"></i><b>콘서트</b><span class="cnt">3</span><div class="ops"><span>수정</span><span class="del">삭제</span></div></div>
    <div class="row"><span class="grip">⣿</span><i style="background:#06b6d4"></i><b>예능</b><span class="cnt">17</span><div class="ops"><span>수정</span><span class="del">삭제</span></div></div>
    <div class="row"><span class="grip">⣿</span><i style="background:#eab308"></i><b>행사</b><span class="cnt">18</span><div class="ops"><span>수정</span><span class="del">삭제</span></div></div>
    <div class="row"><span class="grip">⣿</span><i style="background:#a855f7"></i><b>컴백</b><span class="cnt">1</span><div class="ops"><span>수정</span><span class="del">삭제</span></div></div>
  </div>
  <div class="hint">⣿ 핸들을 드래그해 순서를 바꿀 수 있습니다. 기본 카테고리는 삭제할 수 없습니다.</div>
</div>
</body></html>
