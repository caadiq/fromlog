<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .bk{font-size:18px}
.top b{font-size:12px;letter-spacing:2.5px;font-weight:800;color:#9B9E96}
.cov{padding:34px 44px;background:#F6F7F4;border-bottom:1px solid #E8E8E3}
.cov img{width:100%;aspect-ratio:1;object-fit:cover;display:block;box-shadow:0 18px 44px rgba(20,22,19,.18)}
.info{padding:26px 22px 8px}
.type{font-size:11px;letter-spacing:2.5px;color:#548360;font-weight:800}
h1{font-size:38px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin-top:8px}
.facts{margin-top:22px;border-top:2px solid #141613}
.fact{display:grid;grid-template-columns:104px 1fr;padding:12px 2px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:10px;letter-spacing:2px;color:#9B9E96;font-weight:800}
.fact .v{font-size:14px;font-weight:600}
.fact .v i{font-style:normal;font-size:9px;font-weight:800;background:#548360;color:#fff;border-radius:3px;padding:2px 6px;margin-left:7px;letter-spacing:1px;vertical-align:1px}
.btns{display:flex;gap:10px;padding:18px 22px 6px}
.btn{flex:1;text-align:center;font-size:11.5px;font-weight:800;letter-spacing:1.5px;padding:13px 0;border:1px solid #141613;color:#141613;text-decoration:none}
.btn.g{background:#141613;color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:28px 22px 12px}
.sec b{font-size:11px;letter-spacing:3px;font-weight:800}
.sec span{font-size:11px;color:#548360;font-weight:700}
.tracks{margin:0 22px;border-top:2px solid #141613}
.tr{display:flex;align-items:baseline;gap:14px;padding:14px 2px;border-bottom:1px solid #E8E8E3}
.tr .no{font-size:12px;font-weight:800;color:#C6C8C0;width:24px;font-variant-numeric:tabular-nums}
.tr .t{flex:1;font-size:14.5px;font-weight:700;letter-spacing:-.2px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .t i{font-style:normal;font-size:8.5px;font-weight:800;background:#548360;color:#fff;border-radius:3px;padding:2px 6px;margin-left:8px;letter-spacing:1px;vertical-align:1px}
.tr .du{font-size:12px;color:#9B9E96;font-variant-numeric:tabular-nums}
.photos{display:flex;gap:8px;padding:4px 22px 60px}
.photos img{flex:1;min-width:0;width:30%;aspect-ratio:.8;object-fit:cover;display:block}
.photos .more{flex:1;border:1px solid #E8E8E3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#71756D}
.photos .more b{font-size:16px;font-weight:900;color:#141613}
.photos .more span{font-size:8.5px;letter-spacing:1.5px;font-weight:700}
</style></head><body>
<div class="top"><span class="bk">←</span><b>DISCOGRAPHY / 14</b></div>

    <div class="fact"><span class="k">TRACKS</span><span class="v">6곡 · 17분 44초</span></div>
  </div>
</div>

</div>

</div>
</body></html>
