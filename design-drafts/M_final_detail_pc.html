<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1440px;background:#FBFBF9;color:#141613}
.nav{display:flex;align-items:center;padding:22px 70px;border-bottom:1px solid #E8E8E3}
.logo{font-weight:800;font-size:19px}
.nav .links{display:flex;gap:34px;margin-left:60px}
.nav a{font-size:12px;font-weight:700;letter-spacing:2px;color:#9B9E96;text-decoration:none}
.nav a.on{color:#141613}
.nav .r{margin-left:auto;font-size:11px;letter-spacing:2.5px;color:#9B9E96;font-weight:600}
.spread{display:grid;grid-template-columns:.92fr 1.08fr;border-bottom:1px solid #E8E8E3}
.spread .ph{border-right:1px solid #E8E8E3;position:relative}
.spread .ph img{width:100%;height:100%;object-fit:cover;display:block;min-height:760px;filter:saturate(1.02)}
.spread .ph .no{position:absolute;top:26px;left:30px;font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);letter-spacing:1.5px}
.spread .info{padding:70px 70px 60px;display:flex;flex-direction:column}
.crumb{font-size:11px;letter-spacing:2.5px;color:#9B9E96;font-weight:700}
.crumb i{font-style:normal;color:#548360}
h1{font-size:96px;font-weight:900;letter-spacing:-4.5px;line-height:1;margin-top:22px}
.en{font-size:13px;letter-spacing:5px;color:#548360;font-weight:800;margin-top:14px}
.facts{margin-top:48px;border-top:2px solid #141613}
.fact{display:grid;grid-template-columns:150px 1fr;padding:16px 4px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:11px;letter-spacing:2.5px;color:#9B9E96;font-weight:800}
.fact .v{font-size:16px;font-weight:600;letter-spacing:-.2px}
.fact .v .chip{display:inline-block;font-size:12px;font-weight:700;background:#EDF5EF;color:#3E6348;padding:4px 12px;border-radius:99px;margin-right:6px}
.fact .v a{color:#141613;text-decoration:none;border-bottom:1.5px solid #548360}
.bday{margin-top:auto;display:flex;align-items:center;gap:18px;border:1px solid #E8E8E3;padding:20px 24px;background:#fff}
.bday .d{font-size:30px;font-weight:900;color:#548360;letter-spacing:-1px}
.bday .t{font-size:13.5px;font-weight:600}.bday .s{font-size:11.5px;color:#9B9E96;margin-top:2px}
.gal{padding:56px 70px 90px}
.gal .sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.gal .sec b{font-size:13px;letter-spacing:3.5px;font-weight:800}
.gal .sec span{font-size:12px;color:#548360;font-weight:700}
.gal .row{display:flex;gap:18px}
.gal .g{flex:1}
.gal img{width:100%;aspect-ratio:.8;object-fit:cover;display:block}
.gal .cap{font-size:11px;color:#9B9E96;letter-spacing:1px;margin-top:8px;font-weight:600}
</style></head><body>
