<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1600px;background:#FBFBF9;color:#141613}
.hd{display:flex;align-items:center;padding:0 40px;height:60px;border-bottom:1px solid #E8E8E3}
.hd .logo{font-size:19px;font-weight:900;letter-spacing:-.5px}
.hd .tag{font-size:9px;font-weight:800;letter-spacing:2px;background:#141613;color:#fff;padding:4px 8px;margin-left:10px}
.hd nav{display:flex;gap:24px;margin-left:40px}
.hd nav span{font-size:11px;font-weight:800;letter-spacing:2px;color:#9B9E96}
.hd nav span.on{color:#141613}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.hd .who{font-size:12px;color:#71756D}
.hd .out{font-size:10px;font-weight:800;letter-spacing:1.5px;border:1px solid #141613;padding:8px 14px}
.wrap{max-width:880px;margin:0 auto;padding:52px 40px 90px}
.crumb{font-size:10.5px;letter-spacing:2.5px;font-weight:800;color:#9B9E96}
.title{margin-top:12px;font-size:44px;font-weight:900;letter-spacing:-2px}
.title i{font-style:normal;color:transparent;-webkit-text-stroke:1.6px #141613}
.sec{font-size:10px;letter-spacing:2.5px;font-weight:800;color:#9B9E96;margin:40px 0 12px}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cat{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.5px;padding:11px 18px;border:1px solid #E8E8E3;color:#71756D;background:#fff}
.cat.on{background:#141613;color:#fff;border-color:#141613}
.cat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.form{margin-top:38px;border-top:2px solid #141613;padding-top:30px}
.lab{font-size:10px;font-weight:800;letter-spacing:2.5px;color:#9B9E96}
.row{display:flex;gap:10px;margin-top:10px}
.inp{flex:1;display:flex;align-items:center;border-bottom:2px solid #141613;padding:11px 2px 10px}
.inp b{font-size:15px;font-weight:600;color:#3D423E}
.inp b.ph{color:#C6C8C0;font-weight:500}
.fetch{background:#141613;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:1.5px;padding:0 26px;display:flex;align-items:center}
.prev{margin-top:30px;border:1px solid #E8E8E3;background:#fff;display:flex;gap:24px;padding:20px}
.prev .th{width:300px;aspect-ratio:16/9;background:#141613;position:relative;flex-shrink:0}
.prev .th img{width:100%;height:100%;object-fit:cover;opacity:.9}
.prev .th .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
.prev .inf{flex:1;min-width:0;padding-top:4px}
.prev .badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:1.5px;background:#EDF5EF;color:#3E6348;padding:4px 9px}
.prev h2{margin-top:10px;font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.45}
.prev .meta{margin-top:12px;font-size:12px;color:#9B9E96;line-height:1.9}
.prev .meta b{color:#3D423E;font-weight:700}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:36px;padding-top:24px;border-top:1px solid #E8E8E3}
.btn{font-size:11.5px;font-weight:800;letter-spacing:1.5px;padding:13px 26px;border:1px solid #E8E8E3;color:#71756D;background:#fff}
.btn.ink{background:#141613;border-color:#141613;color:#fff}
</style></head><body>
<div class="hd">
  <span class="logo">fromis_9</span><span class="tag">ADMIN</span>

    <div class="prev">

  </div>
</div>
</body></html>
