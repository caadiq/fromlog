<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:1600px;height:1000px;background:#FBFBF9;color:#141613;display:flex;align-items:center;justify-content:center}
.box{width:420px;text-align:center}
.wm{font-size:34px;font-weight:900;letter-spacing:-1.5px}
.wm i{font-style:normal;color:transparent;-webkit-text-stroke:1.6px #141613}
.badge{display:inline-block;margin-top:12px;font-size:9.5px;font-weight:800;letter-spacing:3px;background:#141613;color:#fff;padding:5px 12px}
.card{margin-top:36px;border:1px solid #141613;background:#fff;padding:40px 38px 36px;text-align:left}
.lab{font-size:10px;font-weight:800;letter-spacing:2.5px;color:#9B9E96}
.inp{display:flex;align-items:center;gap:10px;border-bottom:2px solid #141613;padding:10px 2px 9px;margin:8px 0 26px}
.inp span{color:#9B9E96;font-size:14px}
.inp b{font-size:15px;font-weight:700;color:#C6C8C0;font-weight:500}
.inp .eye{margin-left:auto;color:#C6C8C0;font-size:13px}
.go{display:block;width:100%;background:#141613;color:#fff;text-align:center;font-size:12px;font-weight:800;letter-spacing:2px;padding:15px 0;margin-top:4px}
.back{margin-top:26px;font-size:12px;color:#9B9E96}
</style></head><body>
<div class="box">
  <div class="wm">fromis<i>_9</i></div>
  <div class="badge">ADMIN</div>
  <div class="card">
    <div class="lab">ID</div>
    <div class="inp"><span>◦</span><b>아이디를 입력하세요</b></div>
    <div class="lab">PASSWORD</div>
    <div class="inp"><span>◦</span><b>비밀번호를 입력하세요</b><span class="eye">👁</span></div>
    <div class="go">로그인</div>
  </div>
  <div class="back">← 메인 사이트로 돌아가기</div>
</div>
</body></html>
