<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .mon{display:flex;align-items:center;gap:12px}
.top .mon b{font-size:19px;font-weight:900;letter-spacing:-.5px}
.top .mon .cev{font-size:12px;color:#548360;transform:translateY(1px)}
.top .mon span{color:#9B9E96;font-size:13px}
.top .ic{display:flex;gap:16px;font-size:16px}
.top .ic .on{color:#548360}
.cal{border-bottom:1px solid #E8E8E3;padding:16px 20px 20px;background:#fff}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dow span{text-align:center;font-size:9px;letter-spacing:1.5px;font-weight:800;color:#9B9E96;padding:7px 0}
.dow span:first-child{color:#D08585}
.dow span:last-child{color:#8598C8}
.days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;font-weight:700;color:#3D423E;position:relative}
.d.mut{color:#D8DAD2;font-weight:500}
.d.sun{color:#D08585}.d.sat{color:#8598C8}
.d .dots{display:flex;gap:3px;height:5px}
.d .dots i{width:5px;height:5px;border-radius:50%;display:block}
.d.sel{background:#141613;color:#fff}
.d.today{box-shadow:inset 0 0 0 1.5px #548360}
.calfoot{display:flex;justify-content:center;padding:14px 0 2px}
.calfoot span{font-size:11px;letter-spacing:2px;font-weight:800;color:#548360;border:1px solid #548360;padding:8px 22px}
.datehd{display:flex;align-items:baseline;gap:12px;padding:24px 22px 12px}
.datehd b{font-size:30px;font-weight:900;letter-spacing:-1px}
.datehd span{font-size:10.5px;letter-spacing:2px;color:#9B9E96;font-weight:700}
.list{padding:0 22px 90px}
.ev{display:flex;align-items:baseline;gap:14px;padding:16px 2px;border-bottom:1px solid #E8E8E3}
.ev .tm{width:46px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.ev .t{flex:1;min-width:0}
.ev .t b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t span{font-size:11px;color:#9B9E96;margin-top:2px;display:block}
.ev .c{font-size:10px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.tab{position:fixed;bottom:0;left:0;width:390px;display:flex;background:rgba(251,251,249,.92);backdrop-filter:blur(14px);border-top:1px solid #E8E8E3;padding:11px 0 21px}
.tab div{flex:1;text-align:center;font-size:10px;letter-spacing:2px;color:#B9BCB3;font-weight:700}
.tab div.on{color:#141613}
</style></head><body>
<div class="top">
  <div class="mon"><span>‹</span><b>2026. 7</b><span class="cev">▼</span><span>›</span></div>
  <div class="ic"><span class="on">▦</span><span>⌕</span></div>
</div>
<div class="cal">
  <div class="dow"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
  <div class="days">
    <div class="d mut">28</div><div class="d mut">29</div><div class="d mut">30</div><div class="d">1<div class="dots"><i style="background:#ff0033"></i></div></div><div class="d">2<div class="dots"></div></div><div class="d">3<div class="dots"><i style="background:#ff0033"></i></div></div><div class="d sat">4<div class="dots"></div></div>
    <div class="d sun">5<div class="dots"></div></div><div class="d">6<div class="dots"><i style="background:#ff0033"></i><i style="background:#0f1419"></i></div></div><div class="d">7<div class="dots"><i style="background:#0f1419"></i></div></div><div class="d">8<div class="dots"><i style="background:#ff0033"></i></div></div><div class="d">9<div class="dots"><i style="background:#ff0033"></i></div></div><div class="d">10<div class="dots"></div></div><div class="d sat today">11<div class="dots"></div></div>
    <div class="d sun sel">12<div class="dots"><i style="background:#fff"></i></div></div><div class="d">13<div class="dots"><i style="background:#ff0033"></i></div></div><div class="d">14<div class="dots"></div></div><div class="d">15<div class="dots"></div></div><div class="d">16<div class="dots"></div></div><div class="d">17<div class="dots"></div></div><div class="d sat">18<div class="dots"></div></div>
    <div class="d sun">19<div class="dots"></div></div><div class="d">20<div class="dots"></div></div><div class="d">21<div class="dots"><i style="background:#a855f7"></i><i style="background:#6366f1"></i></div></div><div class="d">22<div class="dots"></div></div><div class="d">23<div class="dots"></div></div><div class="d">24<div class="dots"></div></div><div class="d sat">25<div class="dots"></div></div>
    <div class="d sun">26<div class="dots"></div></div><div class="d">27<div class="dots"></div></div><div class="d">28<div class="dots"></div></div><div class="d">29<div class="dots"></div></div><div class="d">30<div class="dots"></div></div><div class="d">31<div class="dots"></div></div><div class="d mut">1</div>
  </div>
  <div class="calfoot"><span>오늘</span></div>
</div>
<div class="datehd"><b>7. 12.</b><span>SUNDAY</span></div>
<div class="list">
  <div class="ev"><span class="tm">19:00</span><div class="t"><b>워크돌 EP.5</b><span>워크맨-Workman</span></div><span class="c" style="color:#ff0033">유튜브</span></div>
</div>
<div class="tab"><div>HOME</div><div>MEMBERS</div><div>ALBUMS</div><div class="on">SCHEDULE</div></div>
</body></html>
