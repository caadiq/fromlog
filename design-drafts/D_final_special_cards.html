<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613;padding:24px 22px 40px}
.lbl{font-size:10px;letter-spacing:2.5px;color:#9B9E96;font-weight:800;margin:20px 0 10px}
.bday{position:relative;border:1px solid #F2C7D4;background:linear-gradient(120deg,#FFF3F7,#FDEFF4 55%,#F4EDF9);padding:20px 22px;overflow:hidden}
.bday .deco{position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:rgba(228,110,150,.10)}
.bday .k{font-size:9.5px;letter-spacing:3px;font-weight:800;color:#D4548A}
.bday .row{display:flex;align-items:center;gap:16px;margin-top:12px}
.bday img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 4px 14px rgba(212,84,138,.22)}
.bday h3{font-size:21px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
.bday h3 em{font-style:normal;color:#D4548A}
.bday .d{font-size:11px;color:#A98795;font-weight:600;margin-top:3px}
.bday .cake{position:absolute;right:20px;bottom:16px;font-size:22px}
.debut{position:relative;border:1px solid #CBD8CB;background:linear-gradient(120deg,#F0F5F0,#EAF2EC 55%,#E7F0EA);padding:20px 22px;overflow:hidden}
.debut .deco{position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:rgba(84,131,96,.10)}
.debut .k{font-size:9.5px;letter-spacing:3px;font-weight:800;color:#548360}
.debut .row{display:flex;align-items:center;gap:16px;margin-top:12px}
.debut .yr{width:58px;height:58px;border-radius:50%;background:#548360;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(84,131,96,.28)}
.debut .yr b{font-size:20px;font-weight:900;line-height:1}
.debut .yr span{font-size:7.5px;letter-spacing:1.5px;font-weight:800;opacity:.85}
.debut h3{font-size:21px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
.debut h3 em{font-style:normal;color:#548360}
.debut .d{font-size:11px;color:#7C8A7E;font-weight:600;margin-top:3px}
.debut .star{position:absolute;right:20px;bottom:14px;font-size:18px;color:#548360;opacity:.7}
.ref{margin-top:36px;font-size:10px;letter-spacing:1.5px;color:#C6C8C0;font-weight:700;text-align:center}
</style></head><body>
<div class="lbl">생일 카드 — 일정 목록</div>
<div class="bday">
  <div class="deco"></div>
  <span class="k">HAPPY BIRTHDAY</span>
  <div class="row">
    <img src="https://s3.caadiq.co.kr/fromis-9/member/송하영/thumb_400/송하영.webp">
    <div>
      <h3>HAPPY <em>HAYOUNG</em> DAY</h3>
      <div class="d">송하영 · 1997. 9. 29.</div>
    </div>
  </div>
  <span class="cake">🎂</span>
</div>
<div class="lbl">데뷔 · 주년 카드 — 일정 목록</div>
<div class="debut">
  <div class="deco"></div>
  <span class="k">ANNIVERSARY</span>
  <div class="row">
    <div class="yr"><b>9</b><span>YEARS</span></div>
    <div>
      <h3>프로미스나인 데뷔 <em>9주년</em></h3>
      <div class="d">2018. 1. 24. — FROM US, PROMISE</div>
    </div>
  </div>
  <span class="star">✦</span>
</div>
<div class="ref">일정 목록의 헤어라인 리스트 사이에 삽입되는 특수 카드</div>
</body></html>
