<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}

.it{break-inside:avoid;margin-bottom:10px}
.it img{width:100%;display:block}
.it .cap{font-size:9px;letter-spacing:1px;color:#9B9E96;font-weight:800;padding:5px 1px 0}
