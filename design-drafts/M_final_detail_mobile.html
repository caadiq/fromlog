<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #E8E8E3}
.top .bk{font-size:18px}
.top b{font-size:12px;letter-spacing:2.5px;font-weight:800;color:#9B9E96}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:.82;object-fit:cover;display:block;filter:saturate(1.02)}
.ph .no{position:absolute;top:18px;left:20px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);letter-spacing:1.5px}
.info{padding:26px 22px 10px}
h1{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1}
.en{font-size:11px;letter-spacing:4px;color:#548360;font-weight:800;margin-top:8px;display:block}
.facts{margin-top:26px;border-top:2px solid #141613}
.fact{display:grid;grid-template-columns:100px 1fr;padding:13px 2px;border-bottom:1px solid #E8E8E3;align-items:baseline}
.fact .k{font-size:10px;letter-spacing:2px;color:#9B9E96;font-weight:800}
.fact .v{font-size:14px;font-weight:600}
.fact .v .chip{display:inline-block;font-size:11px;font-weight:700;background:#EDF5EF;color:#3E6348;padding:3px 10px;border-radius:99px;margin-right:5px}
.fact .v a{color:#141613;text-decoration:none;border-bottom:1.5px solid #548360}
.bday{margin:20px 22px;display:flex;align-items:center;gap:15px;border:1px solid #E8E8E3;padding:16px 18px;background:#fff}
.bday .d{font-size:24px;font-weight:900;color:#548360}
.bday .t{font-size:12.5px;font-weight:600}.bday .s{font-size:10.5px;color:#9B9E96;margin-top:2px}
.gal{padding:16px 22px 60px}
.gal .sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.gal .sec b{font-size:11px;letter-spacing:3px;font-weight:800}
.gal .sec span{font-size:11px;color:#548360;font-weight:700}
.gal .row{display:flex;gap:10px}
.gal img{flex:1;min-width:0;aspect-ratio:.8;object-fit:cover;display:block;width:33%}
</style></head><body>
<div class="top"><span class="bk">←</span><b>MEMBERS / 01</b></div>
<div class="ph"><span class="no">MEMBER 01 / 05</span><img src="https://s3.caadiq.co.kr/fromis-9/member/송하영/medium_800/송하영.webp"></div>
<div class="info">
  <h1>송하영</h1>
  <span class="en">SONG HAYOUNG</span>
  <div class="facts">
    <div class="fact"><span class="k">BIRTH</span><span class="v">1997. 09. 29</span></div>
    <div class="fact"><span class="k">SNS</span><span class="v"><a href="#">@shy9_29</a></span></div>
  </div>
</div>
<div class="bday"><span class="d">D-80</span><div><div class="t">다음 생일까지</div><div class="s">2026. 09. 29 (화)</div></div></div>
<div class="gal">
  <div class="sec"><b>RECENT PHOTOS</b><span>더보기 →</span></div>
  <div class="row">
    <img src="https://s3.caadiq.co.kr/fromis-9/album/glow-me/photo/thumb_400/05.webp">
    <img src="https://s3.caadiq.co.kr/fromis-9/album/glow-me/photo/thumb_400/06.webp">
    <img src="https://s3.caadiq.co.kr/fromis-9/album/glow-me/photo/thumb_400/07.webp">
  </div>
</div>
</body></html>
