<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',sans-serif}
body{width:390px;background:#FBFBF9;color:#141613}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid #E8E8E3}
.logo{font-weight:800;font-size:17px}
.top span{font-size:11px;letter-spacing:2.5px;color:#9B9E96;font-weight:600}
.head{padding:30px 22px 22px;border-bottom:1px solid #E8E8E3}
.head h1{font-size:42px;font-weight:900;letter-spacing:-2px;line-height:1}
.head h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px #548360}
.head p{font-size:11px;color:#9B9E96;letter-spacing:1.5px;font-weight:600;margin-top:10px}
.year{display:flex;align-items:baseline;gap:16px;padding:26px 22px 4px}
.year b{font-size:20px;font-weight:900;letter-spacing:-.5px}
.year .ln{flex:1;height:1px;background:#E8E8E3;transform:translateY(-5px)}
.year span{font-size:10px;letter-spacing:1.5px;color:#9B9E96;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:24px;padding:12px 22px 16px}
.al .cov{position:relative}
.al img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.al .ph{width:100%;aspect-ratio:1;background:#F0F1EC;display:flex;align-items:center;justify-content:center;color:#C9CFC9;font-size:34px}
.al .meta{margin-top:9px;border-top:2px solid #141613;padding-top:8px}
.al .meta b{display:block;font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .meta span{font-size:10px;letter-spacing:1px;color:#9B9E96;font-weight:700}
.tab{position:fixed;bottom:0;left:0;width:390px;display:flex;background:rgba(251,251,249,.92);backdrop-filter:blur(14px);border-top:1px solid #E8E8E3;padding:11px 0 21px}
.tab div{flex:1;text-align:center;font-size:10px;letter-spacing:2px;color:#B9BCB3;font-weight:700}
.tab div.on{color:#141613}
</style></head><body>
<div class="top"><div class="logo">fromis_9</div><span>ARCHIVE</span></div>
<div class="head"><h1>DISCO<em>GRAPHY</em></h1><p>17 ALBUMS · 2 FULL · 7 MINI · 8 SINGLE</p></div>
<div class="year"><b>2026</b><div class="ln"></div><span>2 RELEASES</span></div>
<div class="grid">
  <div class="al"><div class="cov"><div class="ph">◉</div></div><div class="meta"><b>Glow ME</b><span>정규 2집 · 2026</span></div></div>
  <div class="al"><div class="cov"><img src="https://s3.caadiq.co.kr/fromis-9/album/like-you-better-japanese-ver/cover/thumb_400/cover.webp"></div><div class="meta"><b>LIKE YOU BETTER</b><span>일본 미니 1집 · 2026</span></div></div>
</div>
<div class="year"><b>2025</b><div class="ln"></div><span>2 RELEASES</span></div>
<div class="grid" style="padding-bottom:110px">
  <div class="al"><div class="cov"><img src="https://s3.caadiq.co.kr/fromis-9/album/white-memories/cover/thumb_400/cover.webp"></div><div class="meta"><b>하얀 그리움</b><span>스페셜 싱글 · 2025</span></div></div>
  <div class="al"><div class="cov"><img src="https://s3.caadiq.co.kr/fromis-9/album/from-our-20s/cover/thumb_400/cover.webp"></div><div class="meta"><b>From Our 20's</b><span>미니 6집 · 2025</span></div></div>
</div>
<div class="tab"><div>HOME</div><div>MEMBERS</div><div class="on">ALBUMS</div><div>SCHEDULE</div></div>
</body></html>
